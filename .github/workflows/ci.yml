name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -v

      - name: Generate sample logs and run the analyzer (smoke test)
        env:
          PYTHONPATH: src
        run: |
          python -m aiops generate-logs --output data/ci_sample.txt
          python -m aiops analyze --logs data/ci_sample.txt --config config/config.yaml --output reports
