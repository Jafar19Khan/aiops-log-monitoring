[project]
name = "aiops-log-monitoring"
version = "0.1.0"
description = "Automated log monitoring and incident remediation toolkit for DevOps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "psutil>=5.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
aiops = "aiops.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# DTZ001/DTZ007: log timestamps in this project are intentionally naive (no timezone in the
# "YYYY-MM-DD HH:MM:SS" log format), so timezone-aware datetime rules don't apply here.
# TRY004: we deliberately raise ValueError (not TypeError) for bad config, and tests assert on it.
ignore = ["DTZ001", "DTZ007", "TRY004"]
